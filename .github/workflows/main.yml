name: CI Pipeline - Tests & Performance QA

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

permissions:
  contents: read
  checks: write
  pull-requests: write
  pages: write        # <-- Required for GitHub Pages deployment
  id-token: write 

jobs:
  # -----------------------------------------------------------------
  # Job 1: Fast Python Unit Tests (Fails fast if analyze.py is broken)
  # -----------------------------------------------------------------
  test-python:
    name: Run Python Analysis Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Execute Python Unit Tests
        run: |
          python -m unittest discover -s PerformanceAnalysis/tests -p "test_*.py" -v

  # -----------------------------------------------------------------
  # Job 2: Unity Automated Tests + QA Performance Analysis
  # -----------------------------------------------------------------
  test-unity-and-analyze:
    name: Run Unity Tests & QA Gate
    needs: test-python
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-

      # Run EditMode & PlayMode tests using Game-CI Test Runner
      - name: Run Unity Tests (EditMode & PlayMode)
        uses: game-ci/unity-test-runner@v4
        id: testRunner
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.5.7f1
          testMode: all
          artifactsPath: reports
          githubToken: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python for Analysis
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # Evaluate test results & performance reports against quality thresholds
      - name: Run Performance & Test Gatekeeper (analyze.py)
        run: |
          mkdir -p output
          
          # Map generated test results to reports/test-results.xml if needed
          if [ -f reports/all-results.xml ]; then
            cp reports/all-results.xml reports/test-results.xml
          fi
          
          # Run analysis engine (returns exit code 1 if tests fail or thresholds violate)
          python PerformanceAnalysis/analyze.py \
            --performance reports/performance.json \
            --junit reports/test-results.xml \
            --baseline PerformanceAnalysis/baseline.json \
            --min-fps 60.0 \
            --max-frame-ms 100.0 \
            --output output/summary.json

      # Upload Test & Performance Artifacts (Always runs, even if tests fail)
      - name: Upload QA Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-and-performance-reports
          path: |
            reports/
            output/summary.json
  # -----------------------------------------------------------------
  # Job 3: Deploy WebGL to GitHub Pages (when docs/ exists)
  # -----------------------------------------------------------------
  deploy-webgl:
    name: Deploy WebGL to GitHub Pages
    needs: test-unity-and-analyze
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/main'
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check if WebGL build exists in docs/
        id: check_docs
        run: |
          if [ -f docs/index.html ]; then
            echo "has_docs=true" >> $GITHUB_OUTPUT
          else
            echo "has_docs=false" >> $GITHUB_OUTPUT
            echo "docs/index.html not found. Skipping web deployment."
          fi

      - name: Setup Pages
        if: steps.check_docs.outputs.has_docs == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        if: steps.check_docs.outputs.has_docs == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Deploy to GitHub Pages
        if: steps.check_docs.outputs.has_docs == 'true'
        id: deployment
        uses: actions/deploy-pages@v4